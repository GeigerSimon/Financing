[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financing"
version = "0.1.0"
description = "Extract and categorize transactions from bank statements and PayPal exports."
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
]

[project.scripts]
financing = "main:main"

[tool.setuptools]
py-modules = ["main"]
